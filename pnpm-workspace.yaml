packages:
  - "packages/*"
allowBuilds:
  # msgpackr-extract is a native accelerator for a transitive dependency
  # (msgpack encode/decode) pulled in by the OpenCode SDK toolchain; it has
  # a pure-JS fallback and isn't needed for typecheck/build, so we don't
  # grant it permission to run install scripts.
  # esbuild (bundles the TUI entry): its postinstall only validates the
  # binary, which the optional platform package already provides.
  esbuild: false
  msgpackr-extract: false
  # protobufjs (transitive of @opencode/plugin, types-only devDependency)
  # ships an optional postinstall we do not need.
  protobufjs: false
minimumReleaseAgeExclude:
  - '@opencode/ai@2.2.2'
  - '@opencode/client@2.2.2'
  - '@opencode/plugin@2.2.2'
  - '@opencode/protocol@2.2.2'
  - '@opencode/schema@2.2.2'
  - '@opencode/util@2.2.2'
